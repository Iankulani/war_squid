# ═══════════════════════════════════════════════════════════════════════════════
# WAR-SQUID-V1 - Nginx Configuration
# Author: Ian Carter Kulani
# ═══════════════════════════════════════════════════════════════════════════════

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ── Logging ────────────────────────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # ── Performance ────────────────────────────────────────────────────────────
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    server_tokens off;
    
    # Buffer sizes
    client_body_buffer_size 10K;
    client_header_buffer_size 1k;
    client_max_body_size 100M;
    large_client_header_buffers 4 8k;
    
    # Timeouts
    client_body_timeout 12;
    client_header_timeout 12;
    send_timeout 10;

    # ── Gzip Compression ───────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript 
               application/xml application/xml+rss text/javascript application/x-javascript
               image/svg+xml application/vnd.ms-fontobject application/x-font-ttf
               font/opentype;
    gzip_disable "msie6";
    gzip_min_length 256;

    # ── Security Headers ───────────────────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self' http: https: data: blob: 'unsafe-inline'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Rate Limiting ──────────────────────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/s;
    limit_req_zone $binary_remote_addr zone=web_limit:10m rate=50r/s;
    limit_conn_zone $binary_remote_addr zone=addr:10m;
    limit_req_status 429;

    # ── Upstream Servers ───────────────────────────────────────────────────────
    upstream war_squid_web {
        least_conn;
        server war-squid:5000 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream war_squid_api {
        least_conn;
        server war-squid:5001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream war_squid_phishing {
        least_conn;
        server war-squid:8080 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # ── Include additional configs ─────────────────────────────────────────────
    include /etc/nginx/conf.d/*.conf;
}
