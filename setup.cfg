# ═══════════════════════════════════════════════════════════════════════════════
# WAR-SQUID-V1 - Setup Configuration
# Author: Ian Carter Kulani
# ═══════════════════════════════════════════════════════════════════════════════

[metadata]
name = war-squid-v1
version = 1.0.0
author = Ian Carter Kulani
author_email = ian.carter.kulani@example.com
description = Ultimate Cybersecurity Command & Control Platform
long_description = file: README.md
long_description_content_type = text/markdown
url = https://github.com/ian-carter-kulani/war-squid
license = MIT
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Developers
    Intended Audience :: System Administrators
    Intended Audience :: Information Technology
    License :: OSI Approved :: MIT License
    Operating System :: OS Independent
    Operating System :: POSIX :: Linux
    Operating System :: MacOS
    Operating System :: Microsoft :: Windows
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.8
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Topic :: Security
    Topic :: System :: Networking
    Topic :: System :: Systems Administration
    Topic :: Utilities
keywords = security, cybersecurity, pentesting, networking, automation

[options]
packages = find:
python_requires = >=3.8
include_package_data = True
zip_safe = False
install_requires =
    colorama>=0.4.6
    requests>=2.31.0
    psutil>=5.9.0
    python-dateutil>=2.8.2
    pytz>=2023.3
    six>=1.16.0
    urllib3>=2.0.0
    cryptography>=41.0.0
    paramiko>=3.3.0
    bcrypt>=4.0.1
    passlib>=1.7.4
    pyotp>=2.9.0
    scapy>=2.5.0
    dnspython>=2.4.0
    netifaces>=0.11.0
    netaddr>=0.9.0
    whois>=0.9.5
    Flask>=2.3.0
    Flask-SocketIO>=5.3.0
    Flask-CORS>=4.0.0
    Flask-Limiter>=3.5.0
    Werkzeug>=2.3.0
    Jinja2>=3.1.0
    gunicorn>=21.2.0
    eventlet>=0.33.0
    discord.py>=2.3.0
    telethon>=1.29.0
    slack-sdk>=3.23.0
    google-auth>=2.23.0
    google-api-python-client>=2.100.0
    selenium>=4.14.0
    beautifulsoup4>=4.12.0
    lxml>=4.9.0
    numpy>=1.24.0
    pandas>=2.0.0
    matplotlib>=3.7.0
    seaborn>=0.12.0
    reportlab>=4.0.0
    PyPDF2>=3.0.0
    Pillow>=10.0.0
    qrcode>=7.4.0
    pyshorteners>=1.0.1
    pynput>=1.7.6
    pyautogui>=0.9.54
    pyperclip>=1.8.2
    plyer>=2.1.0
    schedule>=1.2.0
    PyYAML>=6.0
    tabulate>=0.9.0
    tqdm>=4.66.0
    click>=8.1.0
    rich>=13.5.0
    Faker>=19.6.0
    email-validator>=2.0.0
    SQLAlchemy>=2.0.0
    redis>=5.0.0
    cachetools>=5.3.0
    aiohttp>=3.8.0
    aiofiles>=23.2.0
    loguru>=0.7.0
    docker>=6.1.0
    fabric>=3.2.0
    python-dotenv>=1.0.0
    termcolor>=2.3.0
    art>=6.0
    pyfiglet>=0.8.post1

[options.packages.find]
exclude =
    tests
    tests.*
    docs
    venv
    build
    dist

[options.package_data]
* =
    *.txt
    *.md
    *.json
    *.yaml
    *.yml
    *.html
    *.css
    *.js
    Dockerfile
    Dockerfile.alpine
    docker-compose.yml
    .gitlab-ci.yml
    Makefile

[options.entry_points]
console_scripts =
    war-squid = war_squid:main
    war-squid-check = requirements_check:main
    war-squid-health = health:main

[options.extras_require]
dev =
    pytest>=7.4.0
    pytest-asyncio>=0.21.0
    pytest-cov>=4.1.0
    pytest-mock>=3.11.0
    pytest-xdist>=3.3.0
    coverage>=7.3.0
    black>=23.9.0
    flake8>=6.1.0
    pylint>=2.17.0
    mypy>=1.5.0
    isort>=5.12.0
    bandit>=1.7.5
    safety>=2.3.0
    build>=1.0.0
    twine>=4.0.2
full =
    war-squid-v1[dev]
    webdriver-manager>=4.0.0
    plotly>=5.17.0
    kaleido>=0.2.1
    pdfplumber>=0.10.0
    python-docx>=0.8.11
    python-barcode>=0.14.0
    GPUtil>=1.4.0
    APScheduler>=3.10.0

# ── Flake8 ─────────────────────────────────────────────────────────────────────
[flake8]
max-line-length = 100
max-complexity = 20
exclude =
    .git,
    .tox,
    .venv,
    venv,
    __pycache__,
    build,
    dist,
    docs,
    tests,
    setup.py
ignore =
    E203,  # whitespace before ':'
    E266,  # too many leading '#' for block comment
    E501,  # line too long (handled by max-line-length)
    W503,  # line break before binary operator
    W504,  # line break after binary operator
    C901,  # function is too complex
per-file-ignores =
    __init__.py: F401
    tests/*: F401, F811

# ── Tool:pytest ────────────────────────────────────────────────────────────────
[tool:pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=.
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    network: marks tests requiring network access
    security: marks security-related tests

# ── isort ──────────────────────────────────────────────────────────────────────
[isort]
profile = black
line_length = 100
multi_line_output = 3
include_trailing_comma = True
force_grid_wrap = 0
use_parentheses = True
ensure_newline_before_comments = True
skip_gitignore = True
known_first_party = war_squid,requirements_check,health

# ── coverage ───────────────────────────────────────────────────────────────────
[coverage:run]
source = .
omit =
    tests/*
    */__pycache__/*
    */venv/*
    setup.py
branch = True

[coverage:report]
exclude_lines =
    pragma: no cover
    def __repr__
    if self.debug:
    if __name__ == .__main__.:
    raise AssertionError
    raise NotImplementedError
    if 0:
    if False:
ignore_errors = True

# ── bandit ─────────────────────────────────────────────────────────────────────
[bandit]
exclude_dirs = tests,venv,build,dist
skips = B101,B102,B110,B112,B307,B310,B311,B324,B404,B602,B603,B604,B605,B606,B607,B608,B610,B611

# ── pylint ─────────────────────────────────────────────────────────────────────
[pylint]
max-line-length = 100
disable =
    C0114,
    C0115,
    C0116,
    C0103,
    R0913,
    R0914,
    R0915,
    R0902,
    R0903,
    W0703,
    E1101,
    W0613

[pylint.format]
max-line-length = 100
indent-string = "    "

# ── mypy ───────────────────────────────────────────────────────────────────────
[mypy]
python_version = 3.11
warn_return_any = True
warn_unused_configs = True
check_untyped_defs = True
no_implicit_optional = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
warn_unreachable = True
strict_equality = True
ignore_missing_imports = True
exclude = venv/|build/|dist/

[mypy-scapy.*]
ignore_missing_imports = True

[mypy-paramiko.*]
ignore_missing_imports = True

[mypy-discord.*]
ignore_missing_imports = True

[mypy-telethon.*]
ignore_missing_imports = True

[mypy-slack_sdk.*]
ignore_missing_imports = True

[mypy-selenium.*]
ignore_missing_imports = True

[mypy-pynput.*]
ignore_missing_imports = True

[mypy-pyautogui.*]
ignore_missing_imports = True

[mypy-pyperclip.*]
ignore_missing_imports = True

[mypy-plyer.*]
ignore_missing_imports = True

[mypy-qrcode.*]
ignore_missing_imports = True

[mypy-pyshorteners.*]
ignore_missing_imports = True

# ── tox ────────────────────────────────────────────────────────────────────────
[tox:tox]
envlist = py38,py39,py310,py311,py312,lint,coverage
isolated_build = True

[testenv]
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest {posargs:tests}

[testenv:lint]
deps =
    black
    flake8
    pylint
    mypy
    isort
commands =
    black --check .
    isort --check-only .
    flake8 .
    pylint war_squid.py
    mypy war_squid.py

[testenv:coverage]
deps =
    -r requirements.txt
    -r requirements-dev.txt
commands =
    pytest --cov=. --cov-report=html --cov-report=term

# ── bump2version ───────────────────────────────────────────────────────────────
[bumpversion]
current_version = 1.0.0
commit = True
tag = True
tag_name = v{new_version}

[bumpversion:file:setup.py]
search = version='{current_version}'
replace = version='{new_version}'

[bumpversion:file:war_squid.py]
search = VERSION = "{current_version}"
replace = VERSION = "{new_version}"

[bumpversion:file:health.py]
search = VERSION = "{current_version}"
replace = VERSION = "{new_version}"

[bumpversion:file:requirements-check.py]
search = VERSION = "{current_version}"
replace = VERSION = "{new_version}"
