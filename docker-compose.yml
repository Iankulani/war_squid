# ═══════════════════════════════════════════════════════════════════════════════
# WAR-SQUID-V1 - Docker Compose Configuration
# Author: Ian Carter Kulani
# ═══════════════════════════════════════════════════════════════════════════════

version: '3.8'

services:
  # ── Main WAR-SQUID Application ───────────────────────────────────────────────
  war-squid:
    build:
      context: .
      dockerfile: Dockerfile
    image: war-squid-v1:latest
    container_name: war-squid-v1
    hostname: war-squid
    restart: unless-stopped
    ports:
      - "5000:5000"   # Web Dashboard
      - "5001:5001"   # API
      - "8080:8080"   # Phishing Server
      - "4444:4444"   # C2 Server
      - "9000:9000"   # Agent Communication
    volumes:
      - war-squid-data:/app/.war_squid_v1
      - war-squid-reports:/app/war_squid_reports
      - war-squid-temp:/app/temp
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - TZ=UTC
      - WAR_SQUID_ENV=production
      - WAR_SQUID_LOG_LEVEL=INFO
      - WAR_SQUID_WEB_PORT=5000
      - WAR_SQUID_API_PORT=5001
    networks:
      - war-squid-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_PTRACE
    security_opt:
      - no-new-privileges:false
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ── Alpine Lightweight Version ───────────────────────────────────────────────
  war-squid-alpine:
    build:
      context: .
      dockerfile: Dockerfile.alpine
    image: war-squid-v1:alpine
    container_name: war-squid-v1-alpine
    hostname: war-squid-alpine
    restart: unless-stopped
    ports:
      - "5002:5000"
      - "5003:5001"
      - "8081:8080"
      - "4445:4444"
      - "9001:9000"
    volumes:
      - war-squid-alpine-data:/app/.war_squid_v1
      - war-squid-alpine-reports:/app/war_squid_reports
    environment:
      - TZ=UTC
      - WAR_SQUID_ENV=production
      - WAR_SQUID_LOG_LEVEL=INFO
    networks:
      - war-squid-net
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
    profiles:
      - alpine

  # ── Redis Cache ──────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: war-squid-redis
    hostname: war-squid-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    networks:
      - war-squid-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    profiles:
      - full

  # ── PostgreSQL Database ──────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: war-squid-postgres
    hostname: war-squid-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=war_squid
      - POSTGRES_USER=war_squid
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-war_squid_secure_2024}
      - PGDATA=/var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - war-squid-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U war_squid -d war_squid"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    profiles:
      - full

  # ── Nginx Reverse Proxy ──────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: war-squid-nginx
    hostname: war-squid-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    networks:
      - war-squid-net
    depends_on:
      - war-squid
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - full

  # ── Prometheus Monitoring ────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: war-squid-prometheus
    hostname: war-squid-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - war-squid-net
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    profiles:
      - monitoring

  # ── Grafana Dashboard ────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: war-squid-grafana
    hostname: war-squid-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-war_squid_grafana_2024}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - war-squid-net
    depends_on:
      - prometheus
    profiles:
      - monitoring

# ── Networks ───────────────────────────────────────────────────────────────────
networks:
  war-squid-net:
    driver: bridge
    name: war-squid-network
    ipam:
      config:
        - subnet: 172.28.0.0/16

# ── Volumes ────────────────────────────────────────────────────────────────────
volumes:
  war-squid-data:
    name: war-squid-data
  war-squid-reports:
    name: war-squid-reports
  war-squid-temp:
    name: war-squid-temp
  war-squid-alpine-data:
    name: war-squid-alpine-data
  war-squid-alpine-reports:
    name: war-squid-alpine-reports
  redis-data:
    name: war-squid-redis-data
  postgres-data:
    name: war-squid-postgres-data
  nginx-logs:
    name: war-squid-nginx-logs
  prometheus-data:
    name: war-squid-prometheus-data
  grafana-data:
    name: war-squid-grafana-data
